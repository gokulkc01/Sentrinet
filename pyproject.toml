[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrinet"
version = "0.1.0.dev0"
description = "Position-integrity monitoring for drone swarms: detect and isolate a drone whose reported position cannot be trusted."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gokul K C" }]
keywords = ["gnss", "spoofing", "integrity-monitoring", "raim", "uav", "swarm", "uwb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# Runtime is deliberately small: the monitor is linear algebra and statistics.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
plot = ["matplotlib>=3.8"]
# Realistic flight dynamics for phase B. Installed from source; see README.
sim = ["pybullet>=3.2"]

[project.urls]
Homepage = "https://github.com/gokulkc01/Sentrinet"

[tool.setuptools.packages.find]
include = ["sentrinet*"]
exclude = ["legacy*", "tests*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: statistical tests that need many trials (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# legacy/ is frozen v2 code; the vault holds ADRs, which are a historical record --
# a formatter must never silently rewrite either.
extend-exclude = ["legacy", "SentryNet-Vault", "gym-pybullet-drones", ".venv", "sentrinet_env"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "E741",  # ambiguous variable names: `l` is a link index here and reads fine
]

[tool.ruff.lint.isort]
known-first-party = ["sentrinet"]
